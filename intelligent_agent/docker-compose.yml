version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      - SERVICE_REGISTRY_URL=http://service-registry:8761
      - REDIS_URL=redis://redis:6379
    depends_on:
      - service-registry
      - redis

  service-registry:
    image: eureka-server:latest
    ports:
      - "8761:8761"

  llm-service:
    build: ./llm-service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - kafka
      - redis

  scenario-service:
    build: ./scenario-service
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
    depends_on:
      - mongodb

  tool-service:
    build: ./tool-service
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  orchestrator-service:
    build: ./orchestrator-service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MONGODB_URL=mongodb://mongodb:27017
    depends_on:
      - kafka
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  mongodb_data:
  redis_data:
  kafka_data: